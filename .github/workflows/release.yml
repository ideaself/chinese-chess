name: Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: 安装依赖
        run: npm ci

      - name: 单元测试
        run: npx vitest run

      - name: Web 构建
        run: npm run build

      - name: 生成 Android 工程
        run: npx cap add android && npx cap sync android

      # 允许明文 HTTP（自建 WebDAV 服务器常为 http://，Android 9+ 默认禁止）
      - name: 放行明文 HTTP
        run: |
          sed -i 's|<application|<application\n        android:usesCleartextTraffic="true"|' android/app/src/main/AndroidManifest.xml
          grep -q usesCleartextTraffic android/app/src/main/AndroidManifest.xml

      # 配置了以下 Secrets 时构建正式签名 APK，否则回退 debug 签名：
      #   ANDROID_KEYSTORE_BASE64 / ANDROID_KEYSTORE_PASSWORD
      #   ANDROID_KEY_ALIAS / ANDROID_KEY_PASSWORD
      - name: 配置正式签名（可选）
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: node scripts/ci-sign.mjs

      - name: 构建 APK
        run: |
          cd android && chmod +x gradlew
          if [ -f key.properties ]; then
            ./gradlew assembleRelease
            mkdir -p ../apk-out
            cp app/build/outputs/apk/release/app-release.apk ../apk-out/app.apk
          else
            ./gradlew assembleDebug
            mkdir -p ../apk-out
            cp app/build/outputs/apk/debug/app-debug.apk ../apk-out/app.apk
          fi

      - name: 整理产物
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mv apk-out/app.apk "apk-out/chinese-chess-v${VERSION}.apk"

      - name: 创建 GitHub Release 并上传 APK
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: apk-out/*.apk
          generate_release_notes: true

name: Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: 安装依赖
        run: npm ci

      - name: 单元测试
        run: npx vitest run

      - name: Web 构建
        run: npm run build

      # android/ 不入库（.gitignore），CI 内按 Capacitor 模板生成
      - name: 生成 Android 工程
        run: npx cap add android --skip-app && npx cap sync android

      - name: 构建 Debug APK（debug 签名可直接安装）
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug

      - name: 整理产物
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p apk-out
          cp android/app/build/outputs/apk/debug/app-debug.apk "apk-out/中国象棋-${VERSION}.apk"

      - name: 创建 GitHub Release 并上传 APK
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: apk-out/*.apk
          generate_release_notes: true
